[project]
name = "todo-app"
version = "0.1.0"
description = "A command-line Todo application with in-memory storage"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
todo-app = "todo_app.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/todo_app"]

[tool.ruff]
line-length = 88
target-version = "py313"
